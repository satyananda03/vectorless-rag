[project]
name = "pageindex"
version = "0.2.10"
description = "Python SDK for PageIndex — reasoning-based, vectorless document retrieval, cloud and local"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ray", email = "ray@vectify.ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["rag", "document", "retrieval", "llm", "pageindex", "vectorless"]
dependencies = [
    "litellm>=1.105.0",
    "openai>=1.70.0",
    "requests>=2.28.0",
    "urllib3>=1.26",
    "PyPDF2==3.0.1",
    "pypdfium2==5.13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "regex>=2024.0.0",
    "sortedcontainers==2.4.0",
    "Pillow>=9.0",
    "langchain-core>=1.0,<2",
    "langfuse>=4.14.0",
    "langchain>=1.3.14",
    "langgraph>=1.2.5",
    "deepagents>=0.6.10",
    "html-table-rescuer>=0.3.1",
    "unstructured[docx,xlsx]>=0.27.25",
    "pymupdf>=1.28.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "boto3>=1.43.114",
    "pydantic-settings>=2.16.0",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/VectifyAI/PageIndex"
Homepage = "https://pageindex.ai"
Documentation = "https://docs.pageindex.ai"
Issues = "https://github.com/VectifyAI/PageIndex/issues"

[tool.poetry]
packages = [{ include = "pageindex" }]
include = [
    { path = "pageindex/config.yaml", format = ["sdist", "wheel"] },
    { path = "pageindex/flash/data/*.json", format = ["sdist", "wheel"] },
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
