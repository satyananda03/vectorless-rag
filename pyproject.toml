[project]
name = "vectorless-rag"
version = "0.1.0"
description = "Vectorless RAG on PageIndex: Textract + VLM multimodal indexing (scans, images, office files, xlsx, tables, figures) and the audit agent"
requires-python = ">=3.11"
dependencies = [
    # Upstream PageIndex, pinned to a tested commit; litellm, openai, PyPDF2, ... come
    # pinned by it. To upgrade: change the commit, `uv lock --upgrade-package pageindex`,
    # then `uv run pytest`.
    "pageindex @ git+https://github.com/VectifyAI/PageIndex@c11c2342877e0e42aecbc7583c9a1a22be0ad000",
    "pymupdf>=1.28.2",
    "boto3>=1.43.114",
    "pydantic-settings>=2.16.0",
    "httpx",
    "tenacity",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "unstructured[xlsx]>=0.27.25",
    "html-table-rescuer>=0.3.1",
    "openpyxl",
    "beautifulsoup4",
]

[project.optional-dependencies]
# .docx/.pptx/.doc/.odt/.rtf -> PDF through `unoconvert`; also needs LibreOffice on the system
office = ["unoserver"]
# the audit agent in app/
app = ["langgraph>=1.2.5", "langchain>=1.3.14", "deepagents>=0.6.10", "langfuse>=4.14.0", "openai"]

[dependency-groups]
dev = ["pytest>=7.0", "ipykernel"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vectorless_rag"]
